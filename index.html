<!DOCTYPE html>

        :root { --cor: #ff0033; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        #card { 
            width: 88%; max-width: 420px; min-height: 450px; background: #0a0a0a; 
            border: 2px solid var(--cor); border-radius: 35px; padding: 40px; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; 
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.1); box-sizing: border-box;
            transition: 0.3s ease;
        }

        #texto { font-size: 24px; font-weight: 800; line-height: 1.2; text-transform: uppercase; color: #fff; }
        
        #consequencia { 
            font-size: 15px; color: #ff9900; margin-top: 30px; 
            font-style: italic; border-top: 1px solid #222; padding-top: 25px; 
            font-weight: 500; line-height: 1.4;
        }

        #timer-box { width: 100%; height: 6px; background: #222; border-radius: 10px; margin-top: 25px; display: none; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff; }

        button { 
            margin-top: 30px; width: 88%; max-width: 420px; padding: 22px; 
            border-radius: 20px; border: none; background: white; color: black; 
            font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.95); opacity: 0.9; }
        #stats { margin-top: 15px; font-size: 10px; opacity: 0.3; letter-spacing: 2px; }
    </style>
</head>

        <div id="timer-box"><div id="timer-fill"></div></div>
    </div>

        // Sorteio inicial
        deck = deck.sort(() => Math.random() - 0.5).slice(0, 100);

        function proxima() {
            if (deck.length === 0) {
                document.getElementById('texto').innerText = "O CAOS CHEGOU AO FIM.";
                document.getElementById('consequencia').innerText = "Todos vivos?";
                document.getElementById('num').innerText = "0";
                return;
            }

            const index = Math.floor(Math.random() * deck.length);
            const carta = deck.splice(index, 1)[0];

            const cardUI = document.getElementById('card');
            const textoUI = document.getElementById('texto');
            const consUI = document.getElementById('consequencia');
            const numUI = document.getElementById('num');
            const tBox = document.getElementById('timer-box');
            const tFill = document.getElementById('timer-fill');

            textoUI.innerText = carta.m;
            consUI.innerText = "OU ENTÃO: " + (carta.c || "Beba 2 doses e siga o jogo.");
            numUI.innerText = deck.length;

            // Feedback visual: Se for REGRA ou DUELO, a borda brilha azul
            if(carta.m.includes("REGRA") || carta.m.includes("DUELO")) {
                cardUI.style.borderColor = "#00f2ff";
                cardUI.style.boxShadow = "0 0 40px rgba(0, 242, 255, 0.2)";
            } else {
                cardUI.style.borderColor = "#ff0033";
                cardUI.style.boxShadow = "0 0 40px rgba(255, 0, 51, 0.1)";
            }

            if (carta.s) {
                tBox.style.display = 'block';
                tFill.style.transition = 'none';
                tFill.style.width = '100%';
                setTimeout(() => {
                    tFill.style.transition = `width ${carta.s}s linear`;
                    tFill.style.width = '0%';
                }, 100);
            } else {
                tBox.style.display = 'none';
            }
